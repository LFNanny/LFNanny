repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: detect-private-key
      - id: check-added-large-files
        args: ['--maxkb=2500']

  - repo: local
    hooks:
      - id: block-sensitive-files
        name: Block sensitive extensions and internal folders
        entry: Archivo o carpeta prohibido para el repositorio público
        language: fail
        files: '(?i)(\.(pdf|docx?|xlsx?|pptx?|env|pem|key|p12|jks|keystore|sqlite|db|sql|zip|tar|gz|bak)$|(^|/)\.DS_Store$|(^|/)(docs|mobile)/|(^|/)(google-services\.json|GoogleService-Info\.plist|service-account.*\.json)$)'
